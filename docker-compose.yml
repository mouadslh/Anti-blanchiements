services:
  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aml}
      POSTGRES_USER: ${POSTGRES_USER:-aml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aml_local_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana-oss:12.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_local_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_DB: ${POSTGRES_DB:-aml}
      POSTGRES_USER: ${POSTGRES_USER:-aml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aml_local_dev}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  spark:
    profiles: ["streaming"]
    build:
      context: .
      dockerfile: Dockerfile.spark
    working_dir: /app
    environment:
      AML_STREAMING_CONFIG: /app/config/streaming.json
      AML_STREAMING_SOURCE_TOPIC: ${AML_STREAMING_SOURCE_TOPIC:-transactions}
      AML_STREAMING_FEATURES_TOPIC: ${AML_STREAMING_FEATURES_TOPIC:-features}
      AML_STREAMING_CHECKPOINT_LOCATION: ${AML_STREAMING_CHECKPOINT_LOCATION:-/state/features-v1}
      AML_STREAMING_BOOTSTRAP_SERVERS: kafka:29092
      PYSPARK_PYTHON: python3
      POSTGRES_DB: ${POSTGRES_DB:-aml}
      POSTGRES_USER: ${POSTGRES_USER:-aml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aml_local_dev}
    volumes:
      - ./checkpoints:/state
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    mem_limit: 2g
    command: ["spark-submit", "--master", "local[2]", "--conf", "spark.sql.shuffle.partitions=2", "--packages", "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.8", "/app/src/aml/streaming/feature_job.py"]

  scorer:
    profiles: ["scoring"]
    build:
      context: .
      dockerfile: Dockerfile.scoring
    working_dir: /app
    environment:
      AML_SCORING_CONFIG: ${AML_SCORING_CONFIG:-/app/config/scoring.yaml}
      AML_MODEL_ARTIFACT_DIR: ${AML_MODEL_ARTIFACT_DIR:-/artifacts/models}
      AML_SCORING_INPUT_TOPIC: ${AML_SCORING_INPUT_TOPIC:-features}
      AML_SCORING_SCORES_TOPIC: ${AML_SCORING_SCORES_TOPIC:-scores}
      AML_SCORING_ALERTS_TOPIC: ${AML_SCORING_ALERTS_TOPIC:-alerts}
      AML_SCORING_MODEL: ${AML_SCORING_MODEL:-xgboost}
      AML_SCORING_MODEL_SEED: ${AML_SCORING_MODEL_SEED:-42}
      AML_SCORING_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./artifacts:/artifacts:ro
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 1g
    command: ["python", "-m", "aml.scoring.consumer"]

volumes:
  postgres_data:
  grafana_data:
