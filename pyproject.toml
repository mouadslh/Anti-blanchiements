[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-streaming"
version = "0.1.0"
description = "Local simulated AML streaming detection platform"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "pyyaml>=6,<7"]
models = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4", "xgboost>=2.0", "joblib>=1.3", "pyyaml>=6,<7"]
streaming = ["confluent-kafka>=2.6,<3", "psycopg[binary]>=3.2,<4", "pyspark==3.5.8", "pandas>=2.0,<3", "pyarrow>=12,<13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["integration: tests requiring external runtimes such as Spark"]

[tool.ruff]
line-length = 100
target-version = "py311"
